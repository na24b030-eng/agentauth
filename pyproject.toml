[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trustcart"
version = "0.1.0"
description = "Agent-bound authorization and checkout gateway for Razorpay test mode"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "cryptography==45.0.7",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "google-genai==2.19.0",
  "psycopg[binary]==3.2.10",
  "pyjwt[crypto]==2.10.1",
  "pydantic-settings==2.10.1",
  "razorpay==2.0.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
]

[project.scripts]
trustcart = "trustcart.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/trustcart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires a real PostgreSQL database", "live: requires external provider credentials"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP047"]
