name: Deploy AgentAuth frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static GitHub Pages frontend
        run: npm run build:pages
        env:
          # The browser talks to the locally running AgentAuth services when
          # they are available. Remote visitors automatically receive the
          # explicitly labelled, read-only product preview instead.
          NEXT_PUBLIC_MERCHANT_API_URL: http://localhost:8000
          NEXT_PUBLIC_AGENT_API_URL: http://localhost:8001
      - name: Add downloadable demonstration
        run: |
          mkdir -p out/downloads
          cp artifacts/agentauth-five-minute-demo.mp4 out/downloads/
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
